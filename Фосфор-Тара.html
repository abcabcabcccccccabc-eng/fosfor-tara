<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Фосфор-Тара</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Fira+Sans+Condensed:wght@500;600;700&family=Fira+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: слева меню разделов (сводка, посты, поезда, случаи, работа смены), справа страница выбранного раздела; спокойная шалфейно-серая гамма с приглушённым индиго */
:root{
  --bg:#e8ecea; --panel:#f7f9f8; --inset:#eef2f0; --plan:#e2e8e5; --plan-grid:#d5ddd9; --bldg:#f6f8f7; --bldg-line:#b3bfba;
  --ink:#1e2826; --ink-2:#4a5754; --muted:#76837f; --line:#d3dbd8; --line-2:#b5c1bc;
  --accent:#4a5f8f; --accent-ink:#ffffff; --accent-soft:#dfe4f0;
  --sage:#5f7f64; --sage-soft:#dce8dd; --sand:#a8894a;
  --phos:#dfbe55; --phos-deep:#a8861c; --water:#a9c8d3; --water-deep:#5d8b9a; --metal:#c3cdc9;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-soft:#e0f0e0; --warning-soft:#fbf0d4; --serious-soft:#f9e6dd; --critical-soft:#f6e0e0; --info-soft:#dfe4f0;
  --good-ink:#0a5c0a; --warning-ink:#6e4a00; --serious-ink:#86381a; --critical-ink:#9b2020; --info-ink:#3a4c76;
  --series-sensor:#3e68ad; --series-est:#5b8a2e; --grid:#e1e8e5; --axis:#b5c1bc;
  --hazard:#f39200; --hazard-ink:#111111;
  --shadow:0 1px 2px rgba(30,40,38,.06),0 6px 18px rgba(30,40,38,.06);
  --f-display:"Fira Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Fira Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hdr:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111517; --panel:#181d20; --inset:#14191b; --plan:#151a1d; --plan-grid:#1f272b; --bldg:#1c2226; --bldg-line:#3a4850;
    --ink:#e0e6e4; --ink-2:#a7b2af; --muted:#73807d; --line:#253034; --line-2:#36444a;
    --accent:#9db0dc; --accent-ink:#161c2a; --accent-soft:#232b3d;
    --sage:#8fb394; --sage-soft:#1d2a20; --sand:#cdb07a;
    --phos:#d1b14b; --phos-deep:#9a7b14; --water:#3e6a79; --water-deep:#86b4c3; --metal:#3a464b;
    --good-soft:#10291a; --warning-soft:#30270c; --serious-soft:#331f16; --critical-soft:#361718; --info-soft:#232b3d;
    --good-ink:#6fd66f; --warning-ink:#fcc853; --serious-ink:#f4a585; --critical-ink:#f28b8b; --info-ink:#b5c5ea;
    --series-sensor:#5d86cc; --series-est:#6f9a3e; --grid:#1f272b; --axis:#36444a;
    --shadow:0 1px 2px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#111517; --panel:#181d20; --inset:#14191b; --plan:#151a1d; --plan-grid:#1f272b; --bldg:#1c2226; --bldg-line:#3a4850;
  --ink:#e0e6e4; --ink-2:#a7b2af; --muted:#73807d; --line:#253034; --line-2:#36444a;
  --accent:#9db0dc; --accent-ink:#161c2a; --accent-soft:#232b3d;
  --sage:#8fb394; --sage-soft:#1d2a20; --sand:#cdb07a;
  --phos:#d1b14b; --phos-deep:#9a7b14; --water:#3e6a79; --water-deep:#86b4c3; --metal:#3a464b;
  --good-soft:#10291a; --warning-soft:#30270c; --serious-soft:#331f16; --critical-soft:#361718; --info-soft:#232b3d;
  --good-ink:#6fd66f; --warning-ink:#fcc853; --serious-ink:#f4a585; --critical-ink:#f28b8b; --info-ink:#b5c5ea;
  --series-sensor:#5d86cc; --series-est:#6f9a3e; --grid:#1f272b; --axis:#36444a;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
a{color:var(--accent)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.h3,.ph h3{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- шапка ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;padding-block:9px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;letter-spacing:.01em}
.brand-sub{font-size:12px;color:var(--muted);margin-top:3px}
.shiftbox{display:flex;align-items:center;gap:10px;padding:5px 12px;border-radius:9px;background:var(--inset);border:1px solid var(--line)}
.shiftbox .k{font-size:11px;color:var(--muted)}
.shiftbox .v{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:13px;font-weight:600}
.switch .knob{width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .2s}
.switch[aria-checked="true"] .knob{background:var(--sage)}
.switch[aria-checked="true"] .knob::after{transform:translateX(14px)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.seg.mono button{font-family:var(--f-mono)}
.btn{font-weight:600;font-size:13px;line-height:1.15;padding:8px 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--inset)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-danger{border-color:var(--critical);color:var(--critical-ink)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.tourbar{background:var(--accent-soft);color:var(--ink);border-top:1px solid var(--line);padding-block:12px 0;display:flex;align-items:flex-start;gap:10px 20px;flex-wrap:wrap}
.tourbar .tb-main{flex:1 1 420px;min-width:0;display:grid;gap:4px}
.tourbar .tb-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tourbar .tb-step{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tourbar .tb-title{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.2}
.tourbar .tb-text{font-size:15px;line-height:1.55;max-width:88ch;color:var(--ink)}
.tourbar .tb-text.wait::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;background:var(--accent);vertical-align:1px;animation:softPulse 1.6s ease-in-out infinite}
.tourbar .tb-btns{display:flex;gap:8px;align-items:center;padding-top:2px}
.tourbar .tb-btns .btn{padding:9px 16px;font-size:14px}
.tourbar .tb-prog{flex:1 0 100%;height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.tourbar .tb-prog i{display:block;height:100%;background:var(--accent);transition:width .5s}
.guide-focus{box-shadow:0 0 0 3px var(--accent),var(--shadow) !important;transition:box-shadow .3s}
@keyframes softPulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- раскладка ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;padding-block:16px 32px;align-items:start}
.main{min-width:0;display:grid;gap:16px;align-content:start}
.page{min-width:0;display:grid;gap:16px;align-content:start}
.pad{padding:18px 20px}
.panel.pad{display:grid;gap:16px;align-content:start}
.pg-head{display:grid;gap:6px}
.pg-head h1,.ins-head h1{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15}
.pg-head p{color:var(--ink-2);max-width:75ch}
.ins-head{display:grid;gap:6px}
.pg-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.pg-cols .col{display:grid;gap:14px;min-width:0;align-content:start}

/* ---------- меню слева ---------- */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 16px);max-height:calc(100vh - var(--hdr) - 32px);overflow:auto;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);overscroll-behavior:contain}
.side svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-search{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--inset);color:var(--muted);font-size:13.5px;cursor:pointer;text-align:left}
.side-search:hover{border-color:var(--accent);color:var(--ink)}
.side-search kbd{margin-left:auto}
.side-list{display:grid;gap:1px}
.side-h{font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 10px 3px}
.nav-it{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:5px 10px;border:0;border-radius:9px;background:none;text-align:left;cursor:pointer;color:var(--ink-2);font-size:14px;font-weight:500}
.nav-it:hover{background:var(--inset);color:var(--ink)}
.nav-it[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav-it .badge{margin-left:auto}
.nv-main{display:grid;min-width:0;line-height:1.25}
.nv-main small{font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd{width:10px;height:10px;margin:0 4px;flex:none;border-radius:50%;background:var(--good)}
.nd.nd-warning{background:var(--warning)} .nd.nd-serious{background:var(--serious)} .nd.nd-critical{background:var(--critical)} .nd.nd-info{background:var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:2px;display:grid;gap:1px}
.nav-it.set{font-size:13px;min-height:30px}
.nav-it.set[aria-pressed="true"]{color:var(--ink)}
.iconbtn.menu-btn{display:none}
.side-back{position:fixed;inset:0;z-index:44;background:rgba(10,14,16,.4)}

/* ---------- сводка ---------- */
.home{display:grid;gap:18px}
.hero{padding:22px 24px;display:grid;gap:10px}
.hero h1{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.15}
.hero p{max-width:72ch;color:var(--ink-2);font-size:15px}
.hero-btns{align-items:center;margin-top:6px}
.btn-lg{padding:11px 18px;font-size:15px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{display:grid;gap:10px;align-content:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;color:inherit;font:inherit}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-top b{font-size:15px;font-weight:600}
.card-top h2{font-family:var(--f-display);font-size:21px;font-weight:700}
.pc-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pc-v{font-size:26px;font-weight:500}
.bar{position:relative;display:block;height:8px;border-radius:4px;background:var(--inset);border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:4px;background:var(--phos)}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}
.card-go{font-size:12.5px;color:var(--accent);font-weight:600}
.trk{position:relative;display:block;height:6px;margin:8px 6px;border-radius:3px;background:var(--line)}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.trk b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--panel);border:3px solid var(--accent)}
.trk .city{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;background:var(--line-2)}
.trk-wrap{display:grid}
.trk-lbls{position:relative;height:20px;margin:0 6px;font-size:12px;color:var(--ink-2)}
.trk-lbls span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.trk-lbls span.first{transform:none} .trk-lbls span.last{transform:translateX(-100%)}
.inc-mini{display:grid;gap:6px}
.inc-mini button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);text-align:left;cursor:pointer;font-size:13.5px}
.inc-mini button:hover{border-color:var(--accent)}
.inc-mini time{margin-left:auto;color:var(--muted);font-size:12px}
.train-card h2{font-size:20px}

/* ---------- случаи ---------- */
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.case{display:grid;gap:12px;align-content:start;padding:18px 20px;transition:box-shadow .3s}
.case.hl{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.case h2{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.15}
.case .lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.case p{font-size:14px}
.case-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.case-reset{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- эффект ИИ ---------- */
.eff-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.eff .kpi .v{font-size:30px;line-height:1.15}
.eff .kpi .v small{font-size:14px}
.cmp-tbl th[scope="row"]{white-space:nowrap}
.cmp-tbl td{font-size:13.5px;min-width:180px}
.cmp-ai{color:var(--good-ink)} .cmp-no{color:var(--critical-ink)}

/* ---------- как устроена система ---------- */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}
.flow-col{position:relative;display:grid;gap:10px;align-content:start;padding:16px 16px 18px}
.flow-col:not(:last-child)::after{content:"";position:absolute;right:-22px;top:26px;width:16px;height:16px;background:var(--muted);clip-path:polygon(0 30%,55% 30%,55% 0,100% 50%,55% 100%,55% 70%,0 70%)}
.flow-n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.flow-col h2{font-family:var(--f-display);font-size:18px;font-weight:700}
.flow-col ul{margin:0;padding-left:18px;display:grid;gap:7px;font-size:13.5px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.tag-have{background:var(--inset);color:var(--ink-2);border:1px solid var(--line)}
.tag-add{background:var(--accent-soft);color:var(--info-ink)}
.pr-list{margin:0;padding-left:20px;display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));column-gap:28px}

/* ---------- внедрение и стоимость ---------- */
.cost-tbl .grp th{background:var(--inset);font-family:var(--f-display);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.cost-tbl .sub td{font-weight:600;border-top:1px solid var(--line-2)}
.cost-total{display:flex;align-items:baseline;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--accent-soft)}
.cost-total div{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cost-total b{font-family:var(--f-display);font-size:24px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;align-items:start}
.risk-list{margin:0;padding-left:20px;display:grid;gap:8px}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.plan li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px}
.plan li>div{display:grid;gap:4px;justify-items:start}
.plan-n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);font-weight:700}
.plan p{font-size:13.5px;color:var(--ink-2)}
.sum-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Telegram-бот ---------- */
.tg-wrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:18px;align-items:start}
.phone{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:min(640px,calc(100vh - var(--hdr) - 60px));min-height:420px;border-radius:28px;border:8px solid var(--ink);background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.ph-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--accent);color:var(--accent-ink)}
.ph-top small{display:block;font-size:11.5px;opacity:.85}
.ph-ava{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--phos);color:var(--hazard-ink);font-weight:700;font-size:13px}
.ph-chat{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--inset)}
.ph-empty{color:var(--muted);text-align:center;margin:auto;max-width:28ch;font-size:13px}
.bubble{align-self:flex-start;max-width:92%;display:grid;gap:5px;justify-items:start;padding:9px 11px;border-radius:4px 14px 14px 14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 1px rgba(0,0,0,.04)}
.bubble p{font-size:13.5px}
.bubble time{justify-self:end;font-size:11px;color:var(--muted)}
.mb-to{font-size:11.5px;color:var(--accent);font-weight:600}
.mb-btns{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.mb-btns button{flex:1 1 auto;border:1px solid var(--line-2);background:var(--inset);border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer}
.mb-btns button:hover{border-color:var(--accent)}
.mb-ok{flex:1 1 auto;text-align:center;font-size:12.5px;font-weight:600;color:var(--good-ink);padding:6px 8px}
.ph-input{padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.badge-soft{background:var(--accent);color:var(--accent-ink)}

/* ---------- инциденты: список и карточка ---------- */
.pg-inc{grid-template-columns:270px minmax(0,1fr);align-items:start}
.pg-inc .inc-card{padding:18px 20px}
.pg-inc .inc-list{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 16px);max-height:calc(100vh - var(--hdr) - 32px);overflow:auto}
.pg-inc .inc-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px}
.pg-inc .inc-grid>section.wide{grid-column:1/-1}
.pg-about{max-width:980px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;padding:12px 14px 0}
.pb{padding:12px 14px 14px;display:grid;gap:12px;min-width:0}

.alerts{display:grid;gap:6px}
.alerts:empty{display:none}
.alert{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 6px 5px 12px;border-radius:9px;font-size:13px}
.alert .btn{padding:3px 10px;min-height:0}
.alert b{font-weight:600}
.alert .btn{margin-left:auto}
.alert-critical{background:var(--critical-soft)} .alert-serious{background:var(--serious-soft)} .alert-warning{background:var(--warning-soft)}


/* ---------- сценарии ---------- */
.scn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.scn{display:grid;gap:3px;text-align:left;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer}
.scn:hover{border-color:var(--accent);background:var(--inset)}
.scn-k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.scn-t{font-weight:600;font-size:13.5px}

.ins-head{display:grid;gap:6px}
.ins-head h2{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec{display:grid;gap:8px}
.badge{font-family:var(--f-mono);font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:inline-grid;place-items:center;background:var(--critical);color:#fff}
.empty-hint{color:var(--muted);font-size:13px;padding:6px 0}
.kv{margin:0;display:grid}
.kv div{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0;padding-top:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font-size:13px}
.bigbar{position:relative;height:14px;border-radius:7px;background:var(--inset);overflow:hidden}
.bigbar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--phos)}
.back{justify-self:start}

/* ---------- статусы ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1;padding:4px 9px 4px 7px;border-radius:999px;background:var(--inset);color:var(--ink-2);white-space:nowrap}
.chip i{display:inline-block;flex:none;width:8px;height:8px;background:currentColor}
.s-good{background:var(--good-soft);color:var(--good-ink)} .s-good i{border-radius:50%;background:var(--good)}
.s-info{background:var(--info-soft);color:var(--info-ink)} .s-info i{border-radius:50%;background:var(--accent);width:7px;height:7px}
.s-warning{background:var(--warning-soft);color:var(--warning-ink)} .s-warning i{width:10px;height:9px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--warning)}
.s-serious{background:var(--serious-soft);color:var(--serious-ink)} .s-serious i{width:8px;height:8px;transform:rotate(45deg);background:var(--serious)}
.s-critical{background:var(--critical-soft);color:var(--critical-ink)} .s-critical i{width:8px;height:8px;border-radius:1px;background:var(--critical)}
.dec{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.dec .dec-ic{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.dec .dec-ic i{display:block;width:11px;height:11px}
.dec-good .dec-ic{background:var(--good-soft)} .dec-good .dec-ic i{border-radius:50%;background:var(--good)}
.dec-info .dec-ic{background:var(--info-soft)} .dec-info .dec-ic i{border-radius:50%;background:var(--accent)}
.dec-warning{background:var(--warning-soft);border-color:transparent} .dec-warning .dec-ic{background:var(--panel)} .dec-warning .dec-ic i{width:13px;height:11px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--warning)}
.dec-serious{background:var(--serious-soft);border-color:transparent} .dec-serious .dec-ic{background:var(--panel)} .dec-serious .dec-ic i{transform:rotate(45deg);background:var(--serious)}
.dec-critical{background:var(--critical-soft);border-color:transparent} .dec-critical .dec-ic{background:var(--panel)} .dec-critical .dec-ic i{background:var(--critical);border-radius:2px}
.dec-k{font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dec-t{font-size:14px;font-weight:600;margin-top:1px}
.dec-wo{margin-top:6px;font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- показатели, графики ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.kpi{background:var(--inset);border-radius:9px;padding:8px 10px;min-width:0}
.kpi .k{font-size:11px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
.kpi .v small{font-size:11.5px;color:var(--muted)}
.kpi .x{margin-top:3px}
.kpi .chip{white-space:normal;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--series-sensor)}
.sw.s-est{border-top-color:var(--series-est)}
.sw.s-fc{border-top:2px dashed var(--ink-2)}
.chart{position:relative}
.chart-svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.chart .tick{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart .ref{stroke-width:1.2;stroke-dasharray:5 4}
.chart .ref-plan{stroke:var(--muted)}
.chart .ref-warning{stroke:var(--warning)}
.chart .ref-critical{stroke:var(--critical)}
.chart .ref-label{font-family:var(--f-mono);font-size:10px;fill:var(--ink-2)}
.chart .now{stroke:var(--line-2);stroke-width:1}
.chart .now-t{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .line.s-sensor,.chart .line.s-water{stroke:var(--series-sensor)}
.chart .line.s-est{stroke:var(--series-est)}
.chart .area{fill:var(--series-sensor);opacity:.08}
.chart .fc{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:6 5}
.chart .mk{fill:var(--critical);stroke:var(--panel);stroke-width:2}
.chart .mk-t{font-family:var(--f-mono);font-size:11px;font-weight:500;fill:var(--critical-ink)}
.chart .cross{stroke:var(--ink-2);stroke-width:1}
.chart .dot{stroke:var(--panel);stroke-width:2}
.chart .dot.s-sensor,.chart .dot.s-water{fill:var(--series-sensor)}
.chart .dot.s-est{fill:var(--series-est)}
.chart-tip{position:absolute;top:6px;pointer-events:none;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);min-width:150px;z-index:2}
.tip-t{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-bottom:3px}
.tip-row{display:flex;align-items:center;gap:7px;white-space:nowrap}
.tip-row b{margin-left:auto;padding-left:12px;font-family:var(--f-mono);font-weight:500}
.cam{position:relative;border-radius:9px;overflow:hidden;background:#0b0e10;aspect-ratio:16/9;max-width:100%}
.cam canvas{display:block;width:100%;height:100%}
.ex-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ex{display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;align-items:start}
.ex>i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;line-height:1}
.ex-ok>i{background:var(--good-soft);color:var(--good-ink)}
.ex-warn>i{background:var(--warning-soft);color:var(--warning-ink)}
.ex-bad>i{background:var(--critical-soft);color:var(--critical-ink)}
.ex-off>i{background:var(--inset);color:var(--muted)}
.ex b{display:block;font-weight:600;font-size:13px}
.ex span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.advice{border-radius:9px;padding:10px 12px;background:var(--inset);font-size:13px;display:grid;gap:4px}
.advice b{font-weight:600}
.advice.a-serious{background:var(--serious-soft)} .advice.a-critical{background:var(--critical-soft)} .advice.a-good{background:var(--good-soft)}
.lead-cmp{display:grid;gap:8px}
.lc-h{font-size:12px;font-weight:600;color:var(--ink-2)}
.lc-row{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.lc-bar{height:10px;border-radius:5px;background:var(--inset);position:relative;overflow:hidden}
.lc-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.lc-bar i.thr{background:var(--critical)}
.lc-v{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.plate{display:inline-grid;grid-template-rows:1fr 1fr;flex:none;background:var(--hazard);border:3px solid var(--hazard-ink);border-radius:3px;font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--hazard-ink);text-align:center;min-width:60px;line-height:1}
.plate span{padding:4px 8px}
.plate span:first-child{border-bottom:3px solid var(--hazard-ink)}
.table-wrap{overflow-x:auto}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px}
.ctable th,.ctable td{padding:6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.ctable thead th{border-top:0;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-family:var(--f-display)}
.ctable .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ctable tbody tr.sel{background:var(--accent-soft)}
.link{background:none;border:0;padding:0;font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.spark{display:block;width:90px;height:24px}
.spark-ref{stroke:var(--critical);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.spark-line{fill:none;stroke:var(--series-sensor);stroke-width:1.6}
.spark-end{fill:var(--series-sensor)}

/* ---------- журналы ---------- */
.feed-tools{display:grid;gap:8px}
.feed-tools .seg{width:100%}
.feed-tools .seg button{flex:1 1 0;font-size:12px;padding:6px 3px}
.feed-row{display:flex;gap:8px;align-items:center}
.sel{flex:1 1 auto;min-width:0;font:inherit;font-size:12.5px;padding:6px 8px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink)}
.feed-confirm{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:var(--warning-soft);border-radius:8px;padding:8px 10px;font-size:12.5px}
.feed-confirm span{flex:1 1 140px}
.feed-list{list-style:none;margin:0;padding:0;display:grid}
.feed-empty{padding:12px 0;color:var(--muted);font-size:12.5px}
.ev{padding:9px 0;border-top:1px solid var(--line);display:grid;gap:5px}
.ev:first-child{border-top:0}
.ev-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev-mod{font-size:11px;font-weight:600;color:var(--ink-2)}
.ev time{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ev p{font-size:12.5px}
.mini-log{list-style:none;margin:0;padding:0;display:grid}
.mini-log li{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.mini-log li:first-child{border-top:0;padding-top:0}
.ml-top{display:flex;align-items:center;gap:8px}
.mini-log time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* ---------- инциденты ---------- */
.inc-list{display:grid;gap:8px}
.inc-item{display:grid;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer}
.inc-item:hover{border-color:var(--line-2)}
.inc-item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.inc-it-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inc-it-top time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.inc-it-title{font-weight:600;font-size:13px}
.inc-it-sub{font-size:12px;color:var(--muted)}
#incDetail>.panel{border:0;background:transparent}
.inc-card{display:grid}
.inc-head{display:grid;gap:10px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.inc-head h2{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.15;margin-top:3px}
.plate-wrap{display:flex;gap:10px;align-items:center}
.plate-cap{font-size:12px;color:var(--ink-2);line-height:1.35}
.inc-grid{display:grid}
.inc-grid>section{padding:12px 0;display:grid;gap:9px;align-content:start;min-width:0;border-bottom:1px solid var(--line)}
.zone-map svg{display:block;width:100%;height:auto;border-radius:8px}
.z-bg{fill:var(--inset)}
.z-blk{fill:var(--metal);opacity:.75}
.z-blk.hit{fill:var(--critical);opacity:.55}
.z-bld{fill:var(--panel);stroke:var(--line-2);stroke-width:1.5}
.z-bld.hit{stroke:var(--critical);stroke-width:2}
.z-lbl{font-family:var(--f-display);font-weight:600;font-size:11px;fill:var(--ink-2)}
.z-rail{stroke:var(--ink-2);stroke-width:3}
.z-ties{stroke:var(--inset);stroke-width:1.5;stroke-dasharray:2 6}
.z-plume{fill:var(--serious);opacity:.22}
.z-ring{fill:var(--critical);fill-opacity:.07;stroke:var(--critical);stroke-width:2;stroke-dasharray:7 5}
.z-cont{fill:var(--phos);stroke:var(--ink);stroke-width:1.5}
.z-wind{stroke:var(--ink);stroke-width:2;fill:none}
.z-wind-h{fill:var(--ink)}
.z-t{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-2)}
.m-sc{stroke:var(--ink-2);stroke-width:2}
.zone-legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.zone-legend li{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px}
.lg-ring{border:2px dashed var(--critical);border-radius:50%}
.lg-plume{background:var(--serious);opacity:.45}
.lg-hit{background:var(--critical);opacity:.55}
.zone-sum{font-size:13px}
.facts{margin:0;display:grid}
.facts div{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.facts div:first-child{border-top:0;padding-top:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-size:13px}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:5px 0;font-size:13px}
.tl time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks label{display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer}
.checks input{margin-top:2px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.rep-out{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;line-height:1.55;background:var(--inset);border-radius:8px;padding:12px 14px;margin:0;max-height:420px;overflow:auto}
.msgs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.msg{background:var(--inset);border-radius:10px 10px 10px 3px;padding:8px 11px;font-size:13px;display:grid;gap:3px}
.msg-to{font-size:11px;font-weight:600;color:var(--accent)}
.msg time{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);justify-self:end}

/* ---------- о проекте ---------- */
[hidden]{display:none!important}
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(10,14,16,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border-radius:14px;max-width:820px;width:100%;max-height:min(86vh,900px);overflow:auto;padding:20px 22px;display:grid;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head h2{font-family:var(--f-display);font-size:24px;font-weight:700}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.why article{background:var(--inset);border-radius:9px;padding:11px 13px;display:grid;gap:5px;align-content:start}
.why .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.why h4{font-size:14px;font-weight:600}
.why p{font-size:13px;color:var(--ink-2)}
.why .fix{color:var(--ink);border-top:1px solid var(--line);padding-top:6px}
.how{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13.5px}
.how li::marker{font-family:var(--f-mono);color:var(--sage)}
.gloss{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 20px}
.gloss div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.gloss dt{font-family:var(--f-mono);font-size:12.5px}
.gloss dd{margin:0;font-size:13px;color:var(--ink-2)}
.about-list{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--ink-2)}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;width:min(360px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.16);display:grid;gap:5px;transition:opacity .35s,transform .35s}
.toast.out{opacity:0;transform:translateY(8px)}
.toast-top{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.toast p{font-size:13px}
.toast-foot{font-size:11px;color:var(--muted)}

/* ---------- кнопки-иконки, пауза и перемотка ---------- */
.iconbtn{width:36px;height:36px;flex:none;display:inline-grid;place-items:center;padding:0;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer}
.iconbtn:hover{background:var(--inset);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icongrp{display:flex;gap:6px}
.shiftbox{padding-left:5px}
.shiftbox .iconbtn{width:30px;height:30px;border-radius:7px}
.shiftbox.paused{background:var(--warning-soft);border-color:var(--warning)}
.shiftbox.paused #pauseBtn{background:var(--warning);border-color:var(--warning);color:var(--hazard-ink)}

.alert.acked{opacity:.82}
.alert .btn-ack{background:var(--panel);border-color:var(--sevc)}

/* ---------- поиск ---------- */

<script>
(() => {
'use strict';

/* ---------- утилиты ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let seed = 20251108;
function rand() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function gauss() { let u = 0, v = 0; while (!u) u = rand(); while (!v) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const p2 = n => String(n).padStart(2, '0');
function clock(sec) { sec = ((Math.floor(sec) % 86400) + 86400) % 86400; return p2(Math.floor(sec / 3600)) + ':' + p2(Math.floor(sec / 60) % 60) + ':' + p2(sec % 60); }
const hm = sec => clock(sec).slice(0, 5);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function linreg(xs, ys) {
  const n = xs.length; let sx = 0, sy = 0;
  for (let i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; }
  const mx = sx / n, my = sy / n; let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
  const b = den ? num / den : 0; return { b, a: my - b * mx };
}

/* ---------- языки ---------- */
const LANGS = ['ru', 'kk', 'en'];
let LANG = 'ru';
try { const s = localStorage.getItem('fosfor-tara-lang'); if (LANGS.includes(s)) LANG = s; } catch (e) { /* язык по умолчанию */ }
const L = {};
let CUR_POST = 0; // пост, к которому относится текст: задаётся параметром post
function t(k, p) {
  if (p && p.post != null) CUR_POST = p.post;
  let d = L[LANG][k];
  if (d == null) d = L.ru[k];
  if (d == null) return k;
  return typeof d === 'function' ? d(p || {}) : d;
}
const plRu = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
const plEn = (n, a, b) => (n === 1 ? a : b);
const dec = () => (LANG === 'en' ? '.' : ',');
const f1 = v => (Math.round(v * 10) / 10).toFixed(1).replace('.', dec()).replace('-', '−');
const f2 = v => v.toFixed(2).replace('.', dec());
function dur(sec) {
  if (sec == null || !isFinite(sec)) return '—';
  sec = Math.max(0, Math.round(sec));
  const us = t('u_s'), um = t('u_min'), uh = t('u_h');
  if (sec < 60) return sec + ' ' + us;

  if (m < 60) return m + ' ' + um + (sec % 60 && m < 10 ? ' ' + p2(sec % 60) + ' ' + us : '');
  return Math.floor(m / 60) + ' ' + uh + ' ' + p2(m % 60) + ' ' + um;

// обозначения оборудования и номера
const NM = {
  cont: n => (LANG === 'en' ? 'TC-' : 'ТК-') + String(n).padStart(4, '0'),
  pump: () => (LANG === 'en' ? 'P-' : 'Н-') + (CUR_POST + 1),
  tank: () => (LANG === 'en' ? 'E-' : 'Е-') + (CUR_POST + 3),

// у события есть раздел (mod) и объект: пост налива (post) или контейнер в пути (cont)
function logEvent(sev, mod, k, p = {}, o = {}) {
  if (o.silent) return null;
  const ev = { id: ++evSeq, sev, mod, k, p, t: o.t ?? (mod === 'transit' ? ts.t : posts[0].t),
    post: p.post ?? null, cont: mod === 'transit' && p.c != null ? p.c : null };
  S.events.unshift(ev);
  if (S.events.length > 200) S.events.length = 200;
  renderFeed();
  if (o.notify) { tgPush(o.notify, ev); toast(o.notify, k, p, sev); }
  return ev;
}
const evp = (tr, sev, mod, k, p, o) => logEvent(sev, mod, k, Object.assign({ post: tr.id }, p), o);

/* ---------- инциденты ---------- */
function addIncident(o) {
  const inc = Object.assign({ n: ++incSeq, v: 0, checks: {}, report: null, wind: { from: weather.windFrom, speed: weather.windSpeed } }, o);
  S.incidents.unshift(inc);
  if (S.view !== 'incident' || S.tour) S.selInc = inc.n;
  updateIncBadge();
  return inc;
}
const incByN = n => S.incidents.find(i => i.n === n);
function setIncStatus(n, status) { const inc = incByN(n); if (inc) { inc.status = status; inc.v++; updateIncBadge(); } }
function incAppend(n, e) { const inc = incByN(n); if (inc) { inc.timeline.push(e); inc.v++; } }

const TR = { V: 18, VSRC: 60, DT: 6, PLAN: 90, HH: 92, OVER: 100, NOISE: 0.08, WIN: 40, FWIN: 10, KEEP: 2400 };

const posts = [];
let contSeq = 423;
const curPost = () => posts[S.selPost] || posts[0];

function trLog(tr, k, p, silent) {
  if (silent) return;
  const e = { t: tr.t, k, p: Object.assign({ post: tr.id }, p) };
  tr.log.push(e);
  if (tr.incId) incAppend(tr.incId, e);
}
function trInit(tr, level, warm) {
  Object.assign(tr, {
    cont: contSeq++, pump: true, flowSet: tr.flowBase, level: level - warm * tr.flowBase / 3600 / TR.V * 100 * TR.DT, src: 88 - tr.id * 9, sensor: level, frozen: false, frozenVal: 0, hhOk: true,
    leak: 0, leaked: 0, leakStart: null, leakFire: false, smokeTarget: 0, smoke: 0, fire: 0, fireOut: false, spray: 0,
    virt: level, ema: level, est: level, fault: false, faultAt: null, leakDet: false, disc: 0, discHits: 0,
    hist: [], qm: 0, rate: 0, tto: null, tt90: null, overflowed: false, opStopAt: null,
    stopBy: null, stopSev: null, stopK: null, stopP: null, smokeDet: false, smokeStart: null, sprayAt: null,
    nextAt: null, log: [], incId: null
  });
  tr.sensor = tr.virt = tr.ema = tr.est = tr.level;
  for (let i = 0; i < warm; i++) trTick(tr, true);
  tr.log = [{ t: tr.t - warm * TR.DT, k: 'ev_start', p: { c: tr.cont, post: tr.id } }];
}
function postsInit() {
  posts.length = 0;
  POST_CFG.forEach((c, i) => { const tr = { id: i, t: 11 * 3600 + 2 * 60, flowBase: c.flow }; posts.push(tr); trInit(tr, c.level, 60); });
}
function stopPump(tr, by, sev, k, p, silent) {
  if (!tr.pump) return false;
  tr.pump = false; tr.stopBy = by; tr.stopSev = sev; tr.stopK = k; tr.stopP = Object.assign({ post: tr.id }, p);
  if (by === 'auto') tr.nextAt = tr.t + 420;
  if (!silent) { evp(tr, sev, 'transfer', k, p, by === 'ai' ? { notify: 'n_master' } : {}); trLog(tr, k, p); }

/* ---------- люди на площадке: носимые метки, зоны опасности, эвакуация ---------- */
// координаты плана: 1 пиксель = 0,5 м, зона опасности у поста — 50 м
const PLAN = { postX: [330, 520, 710], railY: 398, zoneR: 100, mpp: 0.5 };
const WAYPTS = [
  { x: 330, y: 362, near: 'post0' }, { x: 520, y: 362, near: 'post1' }, { x: 710, y: 362, near: 'post2' },
  { x: 330, y: 284, near: 'pumps' }, { x: 520, y: 284, near: 'pumps' }, { x: 710, y: 284, near: 'pumps' },
  { x: 808, y: 268, near: 'shop' }, { x: 808, y: 140, near: 'shop' },
  { x: 222, y: 96, near: 'admin' }, { x: 160, y: 196, near: 'med' }, { x: 650, y: 168, near: 'store' }
];
const ASSEMBLY = [{ x: 96, y: 474 }, { x: 904, y: 474 }];
const ROLES = ['role_op', 'role_sling', 'role_master', 'role_fitter', 'role_lab', 'role_elec', 'role_driver', 'role_kip'];
const START_WP = [0, 1, 4, 6, 8, 2, 5, 10];
const people = [];
const hz = [];
const inZone = (p, i) => Math.hypot(p.x - PLAN.postX[i], p.y - PLAN.railY) <= PLAN.zoneR;
const zoneAlarmed = i => hz[i] && hz[i].active && hz[i].alarm != null;

function peopleInit() {
  people.length = 0;
  ROLES.forEach((r, i) => {
    const w = WAYPTS[START_WP[i]];
    people.push({ id: i, role: r, x: w.x + gauss() * 6, y: w.y + gauss() * 4, tx: w.x, ty: w.y, wait: Math.floor(rand() * 25), state: 'work', inZone: false });
  });
  hz.length = 0;
  posts.forEach(() => hz.push({ active: false, start: null, alarm: null, done: false, exposure: 0, maxIn: 0 }));
}
// опасность есть, когда фосфор реально на воздухе: дым, огонь или течь
const hazardOf = tr => tr.fire > 0.05 || tr.smoke > 0.12 || tr.leakFire || (tr.leak > 0 && tr.leaked > 0.03);
// команда на эвакуацию появляется, когда опасность заметили: ИИ сразу, без ИИ — оператор позже
const alarmOf = tr => tr.smokeDet || tr.fire > 0.05 || tr.leakDet || tr.leakFire;

function evacuate(p) {
  if (p.state === 'evac') return;
  const a = ASSEMBLY.reduce((m, q) => (Math.hypot(q.x - p.x, q.y - p.y) < Math.hypot(m.x - p.x, m.y - p.y) ? q : m), ASSEMBLY[0]);
  p.state = 'evac'; p.tx = a.x + gauss() * 10; p.ty = a.y + gauss() * 4; p.wait = 0;
}
function personStep(p, dt) {
  const sp = (p.state === 'evac' ? 2.2 : 1.1) / PLAN.mpp * dt;
  const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
  if (d > sp) { p.x += dx / d * sp; p.y += dy / d * sp; return; }
  p.x = p.tx; p.y = p.ty;
  if (p.state === 'evac') { p.state = 'safe'; p.wait = 30; return; }
  if (p.wait > 0) { p.wait--; return; }
  if (p.state === 'safe' && posts.some((_, i) => zoneAlarmed(i))) { p.wait = 5; return; }
  p.state = 'work';
  const ok = WAYPTS.filter(w => !posts.some((_, i) => zoneAlarmed(i) && Math.hypot(w.x - PLAN.postX[i], w.y - PLAN.railY) < PLAN.zoneR + 12));
  const w = ok[Math.floor(rand() * ok.length)] || WAYPTS[8];
  p.tx = w.x + gauss() * 8; p.ty = w.y + gauss() * 5; p.wait = 8 + Math.floor(rand() * 40);
}
function peopleTick(silent) {
  const dt = TR.DT, now = posts[0].t;
  posts.forEach((tr, i) => {
    const h = hz[i], act = hazardOf(tr);
    if (act && !h.active) Object.assign(h, { active: true, start: now, alarm: null, done: false, exposure: 0, maxIn: 0 });
    if (!act && h.active) h.active = false;
    if (h.active && h.alarm == null && alarmOf(tr)) {
      h.alarm = now;
      const inside = people.filter(p => inZone(p, i));
      inside.forEach(evacuate);
      if (!silent) {
        logEvent('serious', 'people', S.ai ? 'ev_evac_ai' : 'ev_evac_op', { post: i, n: inside.length }, inside.length && S.ai ? { notify: 'n_master' } : {});
        if (S.ai) S.shift.evac = (S.shift.evac || 0) + inside.length;
        if (tr.incId) incAppend(tr.incId, { t: now, k: 'tl_evac', p: { post: i, n: inside.length } });
      }
    }
  });
  for (const p of people) {
    const zi = posts.findIndex((_, i) => hz[i].active && inZone(p, i));
    p.inZone = zi >= 0;
    if (p.inZone) hz[zi].exposure += dt;
    if (p.state !== 'evac' && posts.some((_, i) => zoneAlarmed(i) && inZone(p, i))) evacuate(p);
    personStep(p, dt);
  }
  posts.forEach((tr, i) => {
    const h = hz[i];
    if (!h.active) return;
    const n = people.filter(p => inZone(p, i)).length;
    h.maxIn = Math.max(h.maxIn, n);
    if (h.alarm != null && !h.done && n === 0) {
      h.done = true;
      if (!silent) {
        logEvent('good', 'people', 'ev_evac_done', { post: i, d: now - h.start, e: h.exposure });
        if (tr.incId) incAppend(tr.incId, { t: now, k: 'tl_evac_done', p: { post: i, d: now - h.start } });
      }
    }
  });
}
function nearOf(p) {
  let best = WAYPTS[0], bd = Infinity;
  for (const w of WAYPTS) { const d = Math.hypot(w.x - p.x, w.y - p.y); if (d < bd) { bd = d; best = w; } }
  if (bd > 70) return 'yard';
  return best.near;
}

    substance: 'Yellow (white) phosphorus under water, UN 1381, class 4.2, subsidiary hazard 6.1, hazard code 46',
    quantity: parts.qty, detection: parts.lead, readings: Object.fromEntries(incReadings(inc)),
    timeline: inc.timeline.map(e => `${hm(e.t)} ${t(e.k, e.p)}`), isolation_m: inc.radius, wind: parts.wind, zone: parts.zone,
    actions_done: parts.done || '—', actions_recommended: parts.todo || '—'
  };
  const prompt = `You are the duty industrial safety engineer at a phosphorus plant in Kazakhstan. Write an urgent report to the regional emergency service (ДЧС / ТЖД) from the monitoring data below. This is a training demo on simulated data.

Rules:
- Write the report in ${t('pr_lang')}. Structure: ${t('pr_struct')}.
- Use only facts from the data. Anything missing (names, casualties) write as «${t('pr_unknown')}».
- At most 220 words. No Markdown: no asterisks or hashes, plain numbered items.
- End with ${t('pr_summary')}: what, where, which zone, what people should do.

Data (JSON, values are in the interface language):
${JSON.stringify(data, null, 1)}`;
  inc.busy = true; inc.ctl = new AbortController();
  inc.report = { text: '', note: 'rep_writing' };
  renderIncidents(true);
  try {
    const res = await S.sample(prompt, {
      modelTier: 'quick', signal: inc.ctl.signal,
      onText: ({ text }) => { inc.report.text = text; const out = document.getElementById('repOut'); if (out && S.selInc === inc.n) { out.hidden = false; out.textContent = text; } }
    });
    inc.report = { text: res.text, note: res.truncated ? 'rep_trunc' : 'rep_done' };
  } catch (e) {
    const code = e && e.code;
    if (code === 'cancelled') inc.report = { text: e.text || '', note: 'rep_cancel' };
    else if (code === 'rate_limited') inc.report = { text: e.text || '', note: 'rep_rate' };
    else if (code === 'refused') inc.report = { text: t('rpt', reportParts(inc)), note: 'rep_refused' };
    else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { S.sample = null; inc.report = { text: t('rpt', reportParts(inc)), note: 'rep_nogrant' }; }
    else inc.report = e && e.text ? { text: e.text, note: 'rep_err_partial' } : { text: t('rpt', reportParts(inc)), note: 'rep_err' };
  } finally {
    inc.busy = false; inc.ctl = null;
    if (S.tab === 'inc') renderIncidents(true);
  }
}

function nav(page, user) {
  let [type, a, b] = String(page).split(':'), kind = type, focusCase = null;
  if (type === 'post') { if (!posts[+a]) return; S.sel = { type: 'post', id: +a }; S.selPost = +a; kind = 'obj'; }
  else if (type === 'cont') { S.sel = { type: 'cont', key: a, id: +b }; kind = 'obj'; }
  else if (type === 'train') { kind = 'trains'; page = 'trains'; }
  else if (type === 'case') { kind = 'cases'; focusCase = a; }
  if (!PAGE_EL[kind]) return;
  if (kind !== 'obj') S.sel = null;
  const changed = S.page !== page;
  S.page = page; S.tab = kind;
  for (const [k, sel] of Object.entries(PAGE_EL)) $(sel).hidden = k !== kind;
  if (kind === 'log') renderFeed();
  setNavOpen(false);
  render(true);

}

function renderHandover() {
  const h = S.handover;
  $('#hoBtn').textContent = S.sample === null ? t('rep_btn_tpl') : t('rep_btn_claude');
  $('#hoBtn').disabled = !!(h && h.busy);
  $('#hoNote').textContent = h && h.note ? t(h.note) : t('sh_ho_hint');
  $('#hoOut').hidden = !(h && h.text);
  $('#hoOut').textContent = h ? h.text : '';
  $('#hoCopy').hidden = !(h && h.text && !h.busy);
}
async function genHandover() {
  if (S.handover && S.handover.busy) return;
  if (S.sample === undefined) S.sample = await samplePromise;
  const parts = handoverParts();
  if (!S.sample) { S.handover = { text: t('sh_ho_tpl', parts), note: 'rep_unavail' }; renderHandover(); return; }
  const prompt = `You are the shift supervisor at a phosphorus plant in Kazakhstan. Write a short shift handover note from the console data below. This is a training demo on simulated data.
Rules: write in ${t('pr_lang')}. Structure: ${t('sh_ho_struct')}. Use only these facts. At most 130 words. No Markdown, plain text lines.

Data (JSON):
${JSON.stringify(parts, null, 1)}`;
  S.handover = { text: '', note: 'rep_writing', busy: true };
  renderHandover();
  try {
    const res = await S.sample(prompt, { modelTier: 'quick', onText: ({ text }) => { S.handover.text = text; const o = $('#hoOut'); if (o) { o.hidden = false; o.textContent = text; } } });
    S.handover = { text: res.text, note: 'rep_done' };
  } catch (e) {
    const code = e && e.code;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) S.sample = null;
    S.handover = { text: e && e.text ? e.text : t('sh_ho_tpl', parts), note: code === 'rate_limited' ? 'rep_rate' : (e && e.text ? 'rep_err_partial' : 'rep_err') };
  } finally { if ($('#hoBtn')) renderHandover(); }
}

function feedMatch(e) {

  if (sec === 'people' && e.mod !== 'people') return false;
  if (sec === 'transit' && e.mod !== 'transit') return false;
  if (sec === 'system' && e.mod !== 'system') return false;
  if (S.feedObj !== '') {
    if ((sec === 'transfer' || sec === 'people') && String(e.post) !== S.feedObj) return false;
    if (sec === 'transit' && String(e.cont) !== S.feedObj) return false;
  }
  return true;
}
function evObj(e) {
  if (e.post != null) return ' · ' + t('post_name', { i: e.post + 1 });

}

// люди, которые работают на посту во время вскрытия люка или ремонта
function staffPost(i, n) {
  const x = PLAN.postX[i];
  [...people].sort((a, b) => Math.hypot(a.x - x, a.y - PLAN.railY) - Math.hypot(b.x - x, b.y - PLAN.railY)).slice(0, n).forEach((p, j) => {
    p.x = p.tx = x + (j ? 26 : -24); p.y = p.ty = PLAN.railY - 30 + j * 8; p.state = 'work'; p.wait = 60;
  });
}
function runScenario(i, k) {

}

function guideShow(i) {

function guideNext() {
  const g = S.tour; if (!g || g.running) return;
  const st = GUIDE[g.i];
  if (g.i === GUIDE.length - 1) return endTour();
  if (!st.run) return guideShow(g.i + 1);
  // запуск случая: время идёт, пока ИИ не сделает своё, потом снова пауза с объяснением
  g.running = true; S.hold = false;
  setSpeed(st.run.speed); st.run.go();
  renderTourBar();
  const t0 = Date.now();
  const iv = setInterval(() => {
    if (S.tour !== g) { clearInterval(iv); return; }
    if (st.run.until() || Date.now() - t0 > 40000) {
      clearInterval(iv);
      setTimeout(() => { if (S.tour === g) { setSpeed(0.5); guideShow(g.i + 1); } }, st.run.after);
    }
  }, 100);
}
function runTour(fresh) {

  wake();
  if (fresh !== true) runSb('reset');
  if (!S.ai) setAI(true);
  S.tour = { i: 0, running: false };
  guideShow(0);
}

  try { localStorage.setItem('fosfor-tara-guide', '1'); } catch (e) { /* без сохранения */ }

/* ---------- время: пауза и перемотка ---------- */
// снимок модели раз в 30 с модельного времени, хранится последние 2 часа
const HIST = [];
const SNAP_EVERY = 30, SNAP_MAX = 240;
Object.assign(S, { paused: false, rbIdx: -1 });

// копия состояния; точки истории графиков не меняются после записи,
// поэтому у них копируются только последние, остальные общие
function cloneState(v, key) {
  if (v === null || typeof v !== 'object') return v;
  if (Array.isArray(v)) {
    if (key === 'hist') { const n = v.length; return v.map((p, i) => (i >= n - 12 ? { ...p } : p)); }
    return v.map(x => cloneState(x));
  }
  const o = {};
  for (const k of Object.keys(v)) if (k !== 'ctl' && k !== 'busy') o[k] = cloneState(v[k], k);
  return o;
}
function takeSnap() {
  const last = HIST[HIST.length - 1];
  if (last && last.tp === posts[0].t) HIST.pop();
  HIST.push({ tp: posts[0].t, tt: ts.t, d: cloneState({ posts, people, hz, ts, weather, events: S.events, incidents: S.incidents, shift: S.shift, alarms: S.alarms, tg: S.tg, seq: [seed, evSeq, incSeq, contSeq] }) });
  if (HIST.length > SNAP_MAX) HIST.shift();
}
function maybeSnap() { const last = HIST[HIST.length - 1]; if (!last || posts[0].t - last.tp >= SNAP_EVERY) takeSnap(); }
function resetHistory() { HIST.length = 0; takeSnap(); }

const fillArr = (arr, src) => { arr.length = 0; arr.push(...src); };
function restoreSnap(i) {
  const h = HIST[i]; if (!h) return;
  const d = cloneState(h.d);
  fillArr(posts, d.posts); fillArr(people, d.people); fillArr(hz, d.hz);
  for (const k of Object.keys(ts)) delete ts[k];
  Object.assign(ts, d.ts); Object.assign(weather, d.weather);
  S.events = d.events; S.incidents = d.incidents; S.shift = d.shift; S.alarms = d.alarms || {}; S.tg = d.tg || []; S.tgKey = null;
  [seed, evSeq, incSeq, contSeq] = d.seq;
  S.rbIdx = i;
  cam.parts = []; S.objKey = S.incKey = null; S.trainNum = null; S.feedConfirm = false;
  if (S.sel && (S.sel.type === 'train' || S.sel.type === 'cont') && !ts.trains.some(T => T.key === S.sel.key)) S.sel = null;
  if (!incByN(S.selInc)) S.selInc = S.incidents[0] ? S.incidents[0].n : null;
  updateIncBadge(); renderFeed(); renderReplay(); render(true);
}

function setPaused(on) {
  if (S.paused === on) return;
  if (on) {
    if (S.tour) endTour();
    takeSnap();
    S.paused = true; S.rbIdx = HIST.length - 1;
  } else {
    if (S.rbIdx >= 0 && S.rbIdx < HIST.length - 1) {
      const back = HIST[HIST.length - 1].tp - HIST[S.rbIdx].tp;
      HIST.length = S.rbIdx + 1;
      logEvent('info', 'system', 'ev_rewind', { d: back });
    }
    S.paused = false; S.rbIdx = -1;
  }
  renderReplay(); render(true);
}
// любое действие с моделью во время паузы продолжает время с выбранного момента
function wake() { if (S.paused) setPaused(false); }
function stepSnap(dir) { if (S.paused) restoreSnap(clamp(S.rbIdx + dir, 0, HIST.length - 1)); }

// отметки инцидентов на шкале: момент перед началом каждого
function incMarks() {
  const last = HIST[HIST.length - 1]; if (!last || HIST.length < 2) return [];
  return last.d.incidents.filter(inc => !inc.example).map(inc => {
    const clk = h => (inc.where === 'plant' ? h.tp : h.tt);
    let i = HIST.findIndex(h => clk(h) >= inc.time);
    if (i < 0) return null;
    return { i: Math.max(0, i - 1), inc };
  }).filter(Boolean);
}
function renderReplay() {
  const on = S.paused;
  $('#rbar').hidden = !on;
  $('#shiftbox').classList.toggle('paused', on);
  const pb = $('#pauseBtn'), tt = t(on ? 'play_title' : 'pause_title'), ic = on ? ICON.play : ICON.pause;
  if (pb._i !== ic) { pb.innerHTML = ic; pb._i = ic; }
  pb.title = tt; pb.setAttribute('aria-label', tt); pb.setAttribute('aria-pressed', String(on));
  if (on) {
    const r = $('#rbRange'), n = HIST.length;
    r.max = String(n - 1); r.value = String(S.rbIdx);
    const h = HIST[S.rbIdx], d = HIST[n - 1].tp - h.tp;
    $('#rbTime').textContent = clock(h.tp) + ' · ' + (d > 0 ? t('rb_ago', { d }) : t('rb_now'));
    $('#rbPlay').textContent = t(d > 0 ? 'rb_resume_from' : 'rb_resume');
    $('#rbBack').disabled = S.rbIdx <= 0; $('#rbFwd').disabled = S.rbIdx >= n - 1;
    $('#rbMarks').innerHTML = incMarks().map(m => {

      return `<button class="m-${m.inc.sev}" data-snap="${m.i}" style="left:${(m.i / Math.max(1, n - 1) * 100).toFixed(2)}%" title="${esc(lbl)}" aria-label="${esc(lbl)}"></button>`;
    }).join('');
  }
  measureHeader();
}

/* ---------- тревоги: подтверждение оператором, звук, счётчик во вкладке ---------- */
Object.assign(S, { alarms: {}, sound: false, beepAt: 0 });
try { S.sound = localStorage.getItem('fosfor-tara-sound') === '1'; } catch (e) { /* без сохранения */ }

const alarmClock = pick => (pick.startsWith('cont:') ? ts.t : posts[0].t);
function pickName(pick) {

/* звук: короткие тоны через Web Audio, только после включения пользователем */
let actx = null;
function beep(seq) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    let t0 = actx.currentTime + 0.03;
    for (const [f, d] of seq) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + d + 0.03);
      t0 += d + 0.07;
    }
  } catch (e) { /* звук недоступен */ }
}

}

/* ---------- горячие клавиши ---------- */
function onHotkey(e) {
  if (e.defaultPrevented) return;
  const tg = e.target, tag = (tg.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || tg.isContentEditable;
  const searchOpen = !$('#search').hidden;
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyK') { e.preventDefault(); if (searchOpen) closeSearch(); else openSearch(); return; }
  if (e.key === 'Escape') {
    if (searchOpen) closeSearch();
    else if (document.body.classList.contains('nav-open')) setNavOpen(false);
    else if (S.present) setPresent(false);
    return;
  }
  if (typing || searchOpen || e.ctrlKey || e.metaKey || e.altKey) return;
  const c = e.code;
  if (c === 'Space') {
    if (tag === 'button' || tag === 'a') return;
    e.preventDefault(); setPaused(!S.paused);
  }
  else if (c === 'ArrowLeft' && S.paused) { e.preventDefault(); stepSnap(-1); }
  else if (c === 'ArrowRight' && S.paused) { e.preventDefault(); stepSnap(1); }
  else if (c === 'Slash' && e.shiftKey) { e.preventDefault(); openAbout(true); }
  else if (c === 'Slash' || c === 'NumpadDivide') { e.preventDefault(); openSearch(); }
  else if (/^(Digit|Numpad)[123]$/.test(c)) nav('post:' + (+c.slice(-1) - 1), true);
  else if (c === 'KeyA') ackAlarm('*');
  else if (c === 'KeyR') runSb('reset');
  else if (c === 'KeyD') runTour();
  else if (c === 'KeyP') setPresent(!S.present);
  else if (c === 'KeyM') setSound(!S.sound);
  else if (c === 'KeyT') cycleTheme();
}

  $('#soundBtn').addEventListener('click', () => setSound(!S.sound));
  $('#themeBtn').addEventListener('click', cycleTheme);
  $('#presentBtn').addEventListener('click', () => setPresent(true));
  $('#presentExit').addEventListener('click', () => setPresent(false));
  $('#search').addEventListener('click', e => { if (e.target.id === 'search') closeSearch(); const b = e.target.closest('[data-sr]'); if (b) chooseSearch(+b.dataset.sr); });
  $('#searchIn').addEventListener('input', searchRun);
  $('#searchIn').addEventListener('keydown', e => {
    const n = S.srch.items.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); S.srch.sel = (S.srch.sel + 1) % n; renderSearch(); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); S.srch.sel = (S.srch.sel - 1 + n) % n; renderSearch(); }
    else if (e.key === 'Enter') { e.preventDefault(); chooseSearch(S.srch.sel); }
  });
  $('#csvBtn').addEventListener('click', exportCSV);
  document.addEventListener('fullscreenchange', measureHeader);
  dlPromise.then(d => { S.dl = d || null; renderDlButtons(); });
}

init();
})();
</script>

</body></html>
